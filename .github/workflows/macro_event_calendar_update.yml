name: XAUUSD Macro Event Calendar Update

on:
  workflow_dispatch:
  schedule:
    - cron: "25 06 * * *"

jobs:
  macro-event-calendar-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run macro event calendar update
        run: |
          python -m app.stage9b_macro_event_calendar_update

      - name: Upload macro event artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-macro-event-calendar-update
          path: |
            data/macro/events/
            data/reports/stage9b_macro_event_calendar_update/
          retention-days: 14
