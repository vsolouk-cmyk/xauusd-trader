name: XAUUSD Macro Numeric Update

on:
  workflow_dispatch:
  schedule:
    - cron: "15 21 * * 1-5"

jobs:
  macro-numeric-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run macro numeric update
        run: |
          python -m app.stage9b_macro_numeric_update --start-date 2022-01-01

      - name: Upload macro numeric artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-macro-numeric-update
          path: |
            data/macro/
            data/reports/stage9b_macro_numeric_update/
          retention-days: 14
