name: Stage38B COT Gold Download

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "First COT report year to download"
        required: true
        default: "2009"
      end_year:
        description: "Last COT report year to download; leave empty for current UTC year"
        required: false
        default: ""
      fail_on_empty:
        description: "Fail workflow if no GOLD COT rows are returned"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: stage38b-cot-gold-download-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download-cot-gold:
    name: Download official CFTC COT gold data
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify downloader exists
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/stage38b_download_cftc_cot_gold.py
          python3 -m py_compile tools/stage38b_download_cftc_cot_gold.py

      - name: Download and normalize CFTC COT gold data
        shell: bash
        run: |
          set -euo pipefail

          START_YEAR="${{ github.event.inputs.start_year }}"
          END_YEAR="${{ github.event.inputs.end_year }}"
          FAIL_ON_EMPTY="${{ github.event.inputs.fail_on_empty }}"

          CMD=(
            python3 tools/stage38b_download_cftc_cot_gold.py
            --start-year "${START_YEAR}"
            --out-dir data/cot/cftc
          )

          if [[ -n "${END_YEAR}" ]]; then
            CMD+=(--end-year "${END_YEAR}")
          fi

          if [[ "${FAIL_ON_EMPTY}" == "true" ]]; then
            CMD+=(--fail-on-empty)
          fi

          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Print artifact inventory
        shell: bash
        run: |
          set -euo pipefail
          echo "Generated COT files:"
          find data/cot/cftc -type f -maxdepth 5 | sort
          echo "Normalized CSV line count:"
          wc -l data/cot/cftc/normalized/cot_gold_weekly.csv

      - name: Upload Stage38B COT gold artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage38b-cot-gold-cftc-${{ github.run_number }}
          path: |
            data/cot/cftc/raw/disaggregated_futures_only/cot_gold_088691_raw.json
            data/cot/cftc/normalized/cot_gold_weekly.csv
            data/cot/cftc/metadata/stage38b_cot_gold_download_metadata.json
          if-no-files-found: error
          retention-days: 30
