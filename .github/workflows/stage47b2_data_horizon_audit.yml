name: Stage47B2 Data Horizon Audit

on:
  workflow_dispatch:
    inputs:
      timeframe:
        description: "Timeframe"
        required: false
        default: "M5"
      min_rows:
        description: "Minimum unique candles required"
        required: false
        default: "5000"
      min_days:
        description: "Minimum coverage days required"
        required: false
        default: "20"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Stage47B2 audit
        run: |
          python3 app/stage47b2_data_horizon_audit.py \
            --timeframe "${{ github.event.inputs.timeframe }}" \
            --min-rows "${{ github.event.inputs.min_rows }}" \
            --min-days "${{ github.event.inputs.min_days }}" \
            --merged-out reports/stage47b2/stage47b2_merged_m5.csv \
            --out reports/stage47b2
      - name: Upload Stage47B2 reports
        uses: actions/upload-artifact@v4
        with:
          name: stage47b2-data-horizon-audit
          path: reports/stage47b2/
