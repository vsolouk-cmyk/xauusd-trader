name: Stage47B3 TwelveData M5 History Backfill

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Backfill horizon in days"
        required: true
        default: "90"
      chunk_days:
        description: "Days per provider request window"
        required: true
        default: "7"
      sleep_sec:
        description: "Delay between provider requests"
        required: true
        default: "8"
      min_rows:
        description: "Minimum unique M5 rows required"
        required: true
        default: "5000"
      min_days:
        description: "Minimum coverage days required"
        required: true
        default: "20"

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Stage47B3 backfill
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          python3 app/stage47b3_twelvedata_m5_history_backfill.py \
            --days "${{ github.event.inputs.days }}" \
            --chunk-days "${{ github.event.inputs.chunk_days }}" \
            --sleep-sec "${{ github.event.inputs.sleep_sec }}" \
            --min-rows "${{ github.event.inputs.min_rows }}" \
            --min-days "${{ github.event.inputs.min_days }}" \
            --out reports/stage47b3

      - name: Upload Stage47B3 outputs
        uses: actions/upload-artifact@v4
        with:
          name: stage47b3-history-backfill-outputs
          path: |
            reports/stage47b3/**
            data/normalized/normalized_twelvedata_XAU_USD_5min_backfill_*.csv
