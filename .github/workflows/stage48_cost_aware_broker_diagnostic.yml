name: Stage48 Cost-Aware Broker Diagnostic

on:
  workflow_dispatch:
    inputs:
      broker_csv:
        description: 'Path to broker MT5/AMarkets M5 CSV inside repo'
        required: true
        default: 'data/broker_export/amarkets_xauusd_5m_latest.csv'
      cost_model:
        description: 'Path to Stage48F cost model JSON'
        required: true
        default: 'reports/stage48f/stage48f_cost_model.json'
      point_size:
        description: 'Broker point size for XAUUSD'
        required: true
        default: '0.01'

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Stage48 cost-aware broker diagnostic
        run: |
          python3 app/stage48_cost_aware_broker_diagnostic.py \
            --broker-csv "${{ github.event.inputs.broker_csv }}" \
            --cost-model "${{ github.event.inputs.cost_model }}" \
            --timeframe M5 \
            --point-size "${{ github.event.inputs.point_size }}" \
            --out reports/stage48_cost_aware
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: stage48-cost-aware-broker-diagnostic
          path: reports/stage48_cost_aware
