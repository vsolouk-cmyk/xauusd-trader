name: Stage48D Broker Spread Export Validator

on:
  workflow_dispatch:
    inputs:
      csv_path:
        description: 'Broker/MT5 CSV export path'
        required: false
        default: 'data/broker_export/xauusd_m5_spread_export.csv'
      timeframe:
        description: 'Timeframe'
        required: false
        default: 'M5'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Stage48D validator
        run: |
          python3 app/stage48d_broker_spread_export_validator.py \
            --csv "${{ github.event.inputs.csv_path }}" \
            --timeframe "${{ github.event.inputs.timeframe }}" \
            --out reports/stage48d
      - name: Upload Stage48D reports
        uses: actions/upload-artifact@v4
        with:
          name: stage48d-broker-spread-export-validator
          path: reports/stage48d
