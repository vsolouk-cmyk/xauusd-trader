name: Stage48F Broker Reference Alignment Cost Model

on:
  workflow_dispatch:
    inputs:
      broker_csv:
        description: 'Broker/MT5 AMarkets M5 CSV path in repo or runner'
        required: false
        default: 'data/broker_export/amarkets_xauusd_5m_latest.csv'
      reference_csv:
        description: 'Reference M5 CSV path; leave blank for autodiscovery'
        required: false
        default: ''
      point_size:
        description: 'MT5 point size used to convert spread points to price'
        required: false
        default: '0.01'

jobs:
  stage48f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Stage48F calibration
        run: |
          python3 app/stage48f_broker_reference_alignment_cost_model.py \
            --broker-csv "${{ inputs.broker_csv }}" \
            --reference-csv "${{ inputs.reference_csv }}" \
            --timeframe M5 \
            --point-size "${{ inputs.point_size }}" \
            --out reports/stage48f
      - name: Upload Stage48F reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage48f-reports
          path: reports/stage48f
