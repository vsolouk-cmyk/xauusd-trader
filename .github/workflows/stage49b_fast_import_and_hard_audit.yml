name: Stage49B Fast Import and Hard Audit

on:
  workflow_dispatch:
    inputs:
      run_hard_audit:
        description: "Run hard audit after importer"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

jobs:
  stage49b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fast importer if broker export files are present
        run: |
          python3 app/stage49_amarkets_multitf_importer_fast.py \
            --root . \
            --input-dir data/broker_export \
            --server-utc-offset-hours 3 \
            --point-size 0.01 \
            --out reports/stage49_broker_multitf || true
      - name: Run hard audit
        if: ${{ inputs.run_hard_audit == 'true' }}
        run: |
          python3 app/stage49_multitf_trend_persistence_hard_audit.py \
            --root . \
            --db data/broker_normalized/amarkets_multitf.sqlite \
            --candidates reports/stage49_broker_multitf/stage49_multitf_trend_persistence_candidates.csv \
            --cost-model reports/stage48f/stage48f_cost_model.json \
            --out reports/stage49_broker_multitf || true
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: stage49b-fast-import-hard-audit-reports
          path: reports/stage49_broker_multitf/
          if-no-files-found: warn
