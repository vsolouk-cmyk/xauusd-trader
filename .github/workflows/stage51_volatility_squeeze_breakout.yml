name: Stage51 Volatility Squeeze Breakout Audit

on:
  workflow_dispatch:
    inputs:
      db:
        description: "AMarkets multi-timeframe SQLite path"
        required: false
        default: "data/broker_normalized/amarkets_multitf.sqlite"
      cost_model:
        description: "Stage48F cost model path"
        required: false
        default: "reports/stage48f/stage48f_cost_model.json"

jobs:
  stage51:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas
      - name: Run Stage51 audit
        run: |
          python app/stage51_volatility_squeeze_breakout_audit.py \
            --root . \
            --db "${{ github.event.inputs.db }}" \
            --cost-model "${{ github.event.inputs.cost_model }}" \
            --point-size 0.01 \
            --out reports/stage51_volatility_squeeze
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: stage51-volatility-squeeze-reports
          path: reports/stage51_volatility_squeeze
