name: Stage52 True Forward Shadow

on:
  workflow_dispatch:

jobs:
  stage52-forward-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Stage52 true forward shadow
        run: |
          python app/stage52_volatility_squeeze_forward_shadow.py             --root .             --db data/broker_normalized/amarkets_multitf.sqlite             --cost-model reports/stage48f/stage48f_cost_model.json             --candidates reports/stage51_volatility_squeeze/stage51_volatility_squeeze_breakout_candidates.csv             --out reports/stage52_forward_shadow
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: stage52-forward-shadow-reports
          path: reports/stage52_forward_shadow/
