name: Stage54 Ops Readiness

on:
  workflow_dispatch:

jobs:
  stage54-ops-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Stage54 ops readiness report
        run: |
          python3 app/stage54_ops_readiness_report.py \
            --root . \
            --input-dir ~/Downloads \
            --db data/broker_normalized/amarkets_multitf.sqlite \
            --state-db data/shadow/stage52_forward_shadow.sqlite \
            --stage52-summary reports/stage52_forward_shadow/stage52_volatility_squeeze_forward_shadow_summary.json \
            --runner-summary reports/stage52_forward_shadow/stage52_import_then_forward_shadow_summary.json \
            --stage53-gate-summary reports/stage53_forward_shadow_prep/stage53_forward_shadow_gate_summary.json \
            --out reports/stage54_ops_readiness
      - name: Upload Stage54 reports
        uses: actions/upload-artifact@v4
        with:
          name: stage54-ops-readiness
          path: reports/stage54_ops_readiness
