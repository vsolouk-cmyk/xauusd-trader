name: Stage55 Forward Frequency Report

on:
  workflow_dispatch:

jobs:
  stage55-forward-frequency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Stage55 forward frequency report
        run: |
          python app/stage55_forward_frequency_and_alternative_path.py \
            --root . \
            --db data/broker_normalized/amarkets_multitf.sqlite \
            --state-db data/shadow/stage52_forward_shadow.sqlite \
            --stage51-candidates reports/stage51_volatility_squeeze/stage51_volatility_squeeze_breakout_candidates.csv \
            --stage54-summary reports/stage54_ops_readiness/stage54_ops_readiness_summary.json \
            --config configs/stage55_forward_frequency_plan.json \
            --out reports/stage55_frequency_and_alternatives
