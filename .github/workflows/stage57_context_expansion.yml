name: Stage57 Context Expansion Decision

on:
  workflow_dispatch:

jobs:
  stage57-context-expansion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Stage56 archive and Stage57 context decision
        run: |
          python app/stage56_archive_and_stage57_context_decision.py \
            --root . \
            --stage56-summary reports/stage56_parallel_alt_megascan/stage56_parallel_alt_megascan_summary.json \
            --stage56-candidates reports/stage56_parallel_alt_megascan/stage56_parallel_alt_megascan_candidates.csv \
            --stage55-summary reports/stage55_frequency_and_alternatives/stage55_forward_frequency_and_alternative_path_summary.json \
            --stage54-summary reports/stage54_ops_readiness/stage54_ops_readiness_summary.json \
            --context-manifest configs/stage57_context_source_manifest.json \
            --out reports/stage57_context_expansion
