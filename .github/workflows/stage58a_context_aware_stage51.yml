name: Stage58A Context-Aware Stage51 Audit

on:
  workflow_dispatch:

jobs:
  stage58a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy
      - name: Run Stage58A if local data exists
        run: |
          if [ -f data/broker_normalized/amarkets_multitf.sqlite ]; then
            python app/stage58a_context_aware_stage51_regime_audit.py \
              --root . \
              --db data/broker_normalized/amarkets_multitf.sqlite \
              --cost-model reports/stage48f/stage48f_cost_model.json \
              --stage51-candidates reports/stage51_volatility_squeeze/stage51_volatility_squeeze_breakout_candidates.csv \
              --m15-context reports/stage57_context_precheck/stage57a_m15_context_regime_table.csv \
              --m5-context reports/stage57_context_precheck/stage57a_m5_context_regime_table.csv \
              --config configs/stage58a_context_aware_stage51_regime_audit.json \
              --out reports/stage58_context_aware_stage51
          else
            echo "Local broker DB is intentionally gitignored; run Stage58A locally."
          fi
