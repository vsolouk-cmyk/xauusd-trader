name: Stage58B Context Forward Shadow

on:
  workflow_dispatch:

jobs:
  stage58b-context-forward-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas
      - name: Run Stage58B context forward shadow
        run: |
          python app/stage58b_context_forward_shadow.py \
            --root . \
            --db data/broker_normalized/amarkets_multitf.sqlite \
            --cost-model reports/stage48f/stage48f_cost_model.json \
            --stage58a-candidates reports/stage58_context_aware_stage51/stage58a_context_aware_stage51_regime_audit_candidates.csv \
            --m15-context reports/stage57_context_precheck/stage57a_m15_context_regime_table.csv \
            --m5-context reports/stage57_context_precheck/stage57a_m5_context_regime_table.csv \
            --out reports/stage58_context_forward_shadow
