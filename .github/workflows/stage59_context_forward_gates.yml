name: Stage59 Context Forward Gates

on:
  workflow_dispatch:

jobs:
  stage59-context-forward-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Stage59 gate report
        run: |
          python3 app/stage59_context_forward_gate_report.py \
            --root . \
            --state-db data/shadow/stage58b_context_forward_shadow.sqlite \
            --stage58b-summary reports/stage58_context_forward_shadow/stage58b_context_forward_shadow_summary.json \
            --stage58a-candidates reports/stage58_context_aware_stage51/stage58a_context_aware_stage51_regime_audit_candidates.csv \
            --gates configs/stage59_context_forward_gates.json \
            --out reports/stage59_context_forward_gates
      - uses: actions/upload-artifact@v4
        with:
          name: stage59-context-forward-gates
          path: reports/stage59_context_forward_gates/
