name: Stage60 Context-Aware Family Scan

on:
  workflow_dispatch:

jobs:
  stage60-context-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy
      - name: Run Stage60 context-aware scan
        run: |
          python app/stage60_context_aware_family_scan.py \
            --root . \
            --db data/broker_normalized/amarkets_multitf.sqlite \
            --cost-model reports/stage48f/stage48f_cost_model.json \
            --m15-context reports/stage57_context_precheck/stage57a_m15_context_regime_table.csv \
            --config configs/stage60_context_aware_family_scan.json \
            --out reports/stage60_context_aware_family_scan
      - name: Run Stage60 demo fast-lane readiness
        run: |
          python app/stage60_demo_fastlane_readiness.py \
            --root . \
            --stage58b-state-db data/shadow/stage58b_context_forward_shadow.sqlite \
            --stage59-summary reports/stage59_context_forward_gates/stage59_context_forward_gate_summary.json \
            --out reports/stage60_demo_fastlane
