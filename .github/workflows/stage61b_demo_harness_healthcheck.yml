name: Stage61B Demo Harness Healthcheck

on:
  workflow_dispatch:

jobs:
  stage61b-healthcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Stage61B healthcheck without compile confirmation
        run: |
          python3 app/stage61b_demo_harness_healthcheck.py \
            --root . \
            --out reports/stage61_demo_healthcheck
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: stage61b-demo-harness-healthcheck
          path: reports/stage61_demo_healthcheck
