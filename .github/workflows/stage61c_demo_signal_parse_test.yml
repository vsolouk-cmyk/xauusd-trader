name: Stage61C Demo Signal Parse Test

on:
  workflow_dispatch:

jobs:
  parse-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Stage61C parse test exporter
        run: |
          python3 app/stage61c_demo_signal_parse_test.py \
            --root . \
            --config configs/stage61c_demo_signal_parse_test.json \
            --out reports/stage61_demo_parse_test
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: stage61c-demo-signal-parse-test
          path: reports/stage61_demo_parse_test
