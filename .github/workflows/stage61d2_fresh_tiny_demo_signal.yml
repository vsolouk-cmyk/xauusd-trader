name: Stage61D2 Fresh Tiny Demo Signal
on:
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 app/stage61d2_fresh_tiny_demo_order_signal.py --root . --config configs/stage61d2_fresh_tiny_demo_order_signal.json --out reports/stage61_demo_tiny_order
