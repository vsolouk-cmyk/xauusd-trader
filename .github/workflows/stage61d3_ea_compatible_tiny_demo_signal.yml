name: Stage61D3 EA-Compatible Tiny Demo Signal

on:
  workflow_dispatch:

jobs:
  stage61d3-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate EA-compatible tiny demo signal preview
        run: |
          python3 app/stage61d3_ea_compatible_tiny_demo_signal.py \
            --root . \
            --config configs/stage61d3_ea_compatible_tiny_demo_signal.json \
            --out reports/stage61_demo_tiny_order
