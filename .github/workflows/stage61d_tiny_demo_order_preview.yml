name: Stage61D Tiny Demo Order Preview

on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate Stage61D preview only
        run: |
          python app/stage61d_tiny_demo_order_signal.py \
            --root . \
            --config configs/stage61d_tiny_demo_order_test.json \
            --stage61c2-summary reports/stage61_demo_parse_telemetry/stage61c2_demo_ea_telemetry_summary.json \
            --out reports/stage61_demo_tiny_order
