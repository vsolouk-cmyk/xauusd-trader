name: Stage66A2 H64L Reconstruction Reconciliation

on:
  workflow_dispatch:
    inputs:
      rerun_reconciled_stage66a:
        description: "If true, attempt Stage66A rerun after reconciler writes a proposed v2 rule."
        required: false
        default: "true"

jobs:
  stage66a2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Stage66A2
        run: |
          python -m py_compile app/stage66a2_h64l_reconstruction_reconciler.py app/stage66_common_h64l.py

      - name: Run Stage66A2 reconciler
        run: |
          python app/stage66a2_h64l_reconstruction_reconciler.py \
            --root . \
            --config configs/stage66a2_h64l_reconstruction_reconciler.json \
            --out reports/stage66a2_h64l_reconstruction_reconciler

      - name: Rerun Stage66A if proposed rule exists
        if: ${{ inputs.rerun_reconciled_stage66a == 'true' }}
        run: |
          if [ -f configs/stage66a_h64l_concentration_audit_reconciled_v2.json ]; then
            python app/stage66a_h64l_concentration_audit.py \
              --root . \
              --config configs/stage66a_h64l_concentration_audit_reconciled_v2.json \
              --out reports/stage66a_h64l_concentration_audit_reconciled_v2 \
              --write-events || true
            python app/stage66f_governance_dashboard.py \
              --root . \
              --out reports/stage66f_governance_dashboard || true
          else
            echo "No proposed reconciled Stage66A config was generated."
          fi

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: stage66a2-h64l-reconciliation-reports
          path: |
            reports/stage66a2_h64l_reconstruction_reconciler/**
            reports/stage66a_h64l_concentration_audit_reconciled_v2/**
            reports/stage66f_governance_dashboard/**
            configs/h64l_locked_rule_v2_stage66a2_proposed.json
            configs/stage66a_h64l_concentration_audit_reconciled_v2.json
          if-no-files-found: warn
