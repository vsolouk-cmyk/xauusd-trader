name: Stage66A3 H64L Exact Match Resolution

on:
  workflow_dispatch:
    inputs:
      rerun_reconciled_stage66a:
        description: "Run Stage66A with reconciled v2 config and then Stage66F if exact rule-lock is written"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  stage66a3:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Stage66A3
        run: |
          python -m py_compile app/stage66a3_h64l_exact_match_rule_lock_resolver.py

      - name: Run Stage66A3 exact-match resolver
        run: |
          python app/stage66a3_h64l_exact_match_rule_lock_resolver.py             --root .             --config configs/stage66a3_h64l_exact_match_rule_lock_resolver.json             --out reports/stage66a3_h64l_exact_match_rule_lock_resolver

      - name: Run reconciled Stage66A and Stage66F
        if: ${{ inputs.rerun_reconciled_stage66a == 'true' }}
        run: |
          test -f configs/stage66a_h64l_concentration_audit_reconciled_v2.json
          python app/stage66a_h64l_concentration_audit.py             --root .             --config configs/stage66a_h64l_concentration_audit_reconciled_v2.json             --out reports/stage66a_h64l_concentration_audit_reconciled_v2             --write-events
          python app/stage66f_governance_dashboard.py             --root .             --out reports/stage66f_governance_dashboard

      - name: Upload Stage66A3 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stage66a3-h64l-exact-match-resolution
          path: |
            reports/stage66a3_h64l_exact_match_rule_lock_resolver/**
            reports/stage66a_h64l_concentration_audit_reconciled_v2/**
            reports/stage66f_governance_dashboard/**
            configs/h64l_locked_rule_v2_stage66a3_exact_reconciled.json
            configs/stage66a_h64l_concentration_audit_reconciled_v2.json
          if-no-files-found: warn
