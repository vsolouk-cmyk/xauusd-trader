name: Stage66D Limited Complementary Thesis Scan

on:
  workflow_dispatch:
    inputs:
      write_positions:
        description: "Write per-thesis position CSV files"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  stage66d:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: |
          python3 tests/test_stage66d_limited_complementary_thesis_scan.py

      - name: Run Stage66D
        run: |
          ARGS=""
          if [ "${{ inputs.write_positions }}" = "true" ]; then ARGS="--write-positions"; fi
          python3 app/stage66d_limited_complementary_thesis_scan.py \
            --root . \
            --config configs/stage66d_limited_complementary_thesis_scan.json \
            --out reports/stage66d_limited_complementary_thesis_scan \
            $ARGS

      - name: Upload Stage66D report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stage66d-limited-complementary-thesis-scan
          path: |
            reports/stage66d_limited_complementary_thesis_scan/*.json
            reports/stage66d_limited_complementary_thesis_scan/*.md
            reports/stage66d_limited_complementary_thesis_scan/*.csv
