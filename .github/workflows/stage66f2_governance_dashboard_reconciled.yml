name: Stage66F2 Governance Dashboard Reconciled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage66f2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Stage66F2 reconciled dashboard
        run: |
          python app/stage66f2_governance_dashboard_reconciled.py \
            --root . \
            --config configs/stage66f2_governance_dashboard_reconciled.json \
            --out reports/stage66f2_governance_dashboard_reconciled

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: stage66f2-governance-dashboard-reconciled
          path: |
            reports/stage66f2_governance_dashboard_reconciled/
