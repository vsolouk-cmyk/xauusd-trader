name: XAUUSD Article 2 Evidence QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install existing core dependency
        run: python -m pip install --disable-pip-version-check pandas==2.2.3

      - name: Compile Article 2 and selected existing core
        run: |
          python -m py_compile \
            app/article2_fail_closed_benchmark.py \
            app/stage170c_asof_join_enforcement_and_validation_framework.py \
            app/xauusd_controlled_paper_historical_replay.py \
            tools/article_publication/run_article2_evidence_suite.py \
            tools/article_publication/verify_article2_evidence_bundle.py \
            tests/test_article2_fail_closed_benchmark.py

      - name: Run bounded Article 2 tests
        run: python -m unittest discover -s tests -p 'test_article2_fail_closed_benchmark.py' -v

      - name: Build deterministic evidence ZIP
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          from tools.article_publication.run_article2_evidence_suite import (
              OUTPUT_FOLDER,
              ZIP_NAME,
              deterministic_zip,
              sha256_file,
          )

          root = Path.cwd()
          parent = root / "artifacts/article2"
          folder = parent / OUTPUT_FOLDER

          if not folder.is_dir():
              raise SystemExit(f"expanded evidence folder missing: {folder}")

          archive = parent / ZIP_NAME
          deterministic_zip(folder, archive)

          digest = sha256_file(archive)
          sidecar = parent / f"{ZIP_NAME}.sha256"
          sidecar.write_text(
              f"{digest}  {ZIP_NAME}\n",
              encoding="utf-8",
          )

          print(f"BUILT: {archive}")
          print(f"SHA256: {digest}")
          PYCODE

      - name: Verify retained folder and ZIP
        run: python tools/article_publication/verify_article2_evidence_bundle.py --root .

      - name: Upload verified evidence
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-article2-evidence-v1
          path: |
            artifacts/article2/article2_evidence_v1/
            artifacts/article2/XAUUSD_ARTICLE2_BENCHMARK_FAULT_INJECTION_EVIDENCE_V1.zip
            artifacts/article2/XAUUSD_ARTICLE2_BENCHMARK_FAULT_INJECTION_EVIDENCE_V1.zip.sha256
          if-no-files-found: error

