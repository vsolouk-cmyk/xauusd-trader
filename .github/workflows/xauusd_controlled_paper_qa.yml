name: XAUUSD Controlled Paper QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile
        run: |
          python -m py_compile app/xauusd_controlled_paper.py tests/test_xauusd_controlled_paper.py

      - name: Unit and regression tests
        run: |
          python -m unittest -v tests.test_xauusd_controlled_paper
