name: XAUUSD Persistent Data Store Refresh

on:
  workflow_dispatch:
    inputs:
      intervals:
        description: "Comma-separated intervals"
        required: true
        default: "1min,5min,15min,1h"
      force_refresh:
        description: "Force provider refresh even if store is fresh"
        required: true
        default: "false"
  schedule:
    # GitHub schedules are not exact. Treat this as best-effort.
    - cron: "17 */2 * * 1-5"

permissions:
  contents: write

jobs:
  refresh-store:
    runs-on: ubuntu-latest

    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Refresh persistent store
        run: |
          if [ "${{ github.event.inputs.force_refresh }}" = "true" ]; then
            python -m app.xauusd_store_refresh --intervals "${{ github.event.inputs.intervals || '1min,5min,15min,1h' }}" --force-refresh
          else
            python -m app.xauusd_store_refresh --intervals "${{ github.event.inputs.intervals || '1min,5min,15min,1h' }}"
          fi

      - name: Show store status
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path('data/store/manifest.json')
          print(p.read_text() if p.exists() else 'manifest missing')
          PY

      - name: Commit store updates
        run: |
          if git diff --quiet -- data/store; then
            echo "No store changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/store
          git commit -m "Update XAUUSD persistent data store"
          git pull --rebase
          git push
