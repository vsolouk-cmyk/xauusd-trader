name: XAUUSD FRED Exogenous Refresh

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "First date to keep in FRED exogenous CSVs, YYYY-MM-DD"
        required: false
        default: "2022-05-01"
      strict:
        description: "Fail workflow if any FRED source fails: 0 or 1"
        required: false
        default: "0"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  fred-exogenous-refresh:
    name: Download FRED exogenous data and run Stage31A
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install pandas numpy
          fi

      - name: Download FRED exogenous CSVs
        env:
          FRED_EXOGENOUS_START_DATE: ${{ github.event.inputs.start_date || '2022-05-01' }}
          FRED_EXOGENOUS_OUT_DIR: data/exogenous
          FRED_EXOGENOUS_STRICT: ${{ github.event.inputs.strict || '0' }}
          FRED_EXOGENOUS_ATTEMPTS: "4"
        run: |
          python tools/download_fred_exogenous.py
          echo "Downloaded/usable exogenous files:"
          wc -l data/exogenous/*.csv || true
          echo "FRED manifest:"
          cat data/exogenous/fred_download_manifest.csv || true
          head -n 5 data/exogenous/dxy.csv || true

      - name: Build Stage30A ML dataset if available
        run: |
          if [ -f app/stage30a_candidate_pool_builder_ml_dataset.py ]; then
            python -m app.stage30a_candidate_pool_builder_ml_dataset
          else
            echo "Stage30A module is missing; Stage31A will emit a base-dataset readiness report."
          fi
          ls -lh data/reports/stage30a_candidate_pool_builder_ml_dataset/stage30a_ml_meta_dataset.csv || true

      - name: Run Stage31A exogenous ingestion
        run: |
          python -m app.stage31a_exogenous_feature_ingestion
          cat data/reports/stage31a_exogenous_feature_ingestion/stage31a_exogenous_feature_ingestion.md

      - name: Upload FRED exogenous artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-fred-exogenous-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            data/exogenous/*.csv
            data/reports/stage31a_exogenous_feature_ingestion/
            data/reports/stage30a_candidate_pool_builder_ml_dataset/
