name: XAUUSD FRED Exogenous Refresh

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "First date to keep in FRED exogenous CSVs, YYYY-MM-DD"
        required: false
        default: "2022-05-01"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  fred-exogenous-refresh:
    name: Download FRED exogenous data and run Stage31A
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install pandas numpy
          fi

      - name: Download FRED exogenous CSVs
        env:
          FRED_EXOGENOUS_START_DATE: ${{ github.event.inputs.start_date || '2022-05-01' }}
          FRED_EXOGENOUS_OUT_DIR: data/exogenous
        run: |
          python tools/download_fred_exogenous.py
          echo "Downloaded exogenous files:"
          wc -l data/exogenous/*.csv || true
          head -n 5 data/exogenous/dxy.csv || true

      - name: Run Stage31A exogenous ingestion
        run: |
          python -m app.stage31a_exogenous_feature_ingestion
          cat data/reports/stage31a_exogenous_feature_ingestion/stage31a_exogenous_feature_ingestion.md

      - name: Upload FRED exogenous artifact
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-fred-exogenous-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            data/exogenous/dxy.csv
            data/exogenous/us10y.csv
            data/exogenous/real_yield.csv
            data/exogenous/vix.csv
            data/exogenous/spx.csv
            data/exogenous/oil.csv
            data/reports/stage31a_exogenous_feature_ingestion/
