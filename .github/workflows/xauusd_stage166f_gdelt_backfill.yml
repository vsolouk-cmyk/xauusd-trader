name: XAUUSD Stage166G Persistent GDELT Four-Hour Refresh

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'UTC start date YYYY-MM-DD; empty defaults to 89 days ago'
        required: false
        default: ''
      end_date:
        description: 'UTC end date YYYY-MM-DD; empty means now'
        required: false
        default: ''
      split_date:
        description: 'Train/holdout split date, health metadata only'
        required: true
        default: '2025-08-13'
      chunk_days:
        description: 'Days per query; 7 preserves hourly resolution with fewer requests'
        required: true
        default: '7'
  schedule:
    - cron: '17 */4 * * *'

concurrency:
  group: xauusd-stage166g-gdelt-refresh
  cancel-in-progress: false

permissions:
  contents: write

env:
  INCOMING_DIR: reports/stage166f_github_gdelt_backfill
  PERSIST_DIR: reports/stage166g_gdelt_persistent_store
  PUBLISH_BRANCH: automation/gdelt-latest

jobs:
  gdelt-refresh:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve bounded acquisition window
        id: vars
        shell: bash
        run: |
          START_DATE="${{ github.event.inputs.start_date || '' }}"
          END_DATE="${{ github.event.inputs.end_date || '' }}"
          SPLIT_DATE="${{ github.event.inputs.split_date || '2025-08-13' }}"
          CHUNK_DAYS="${{ github.event.inputs.chunk_days || '7' }}"

          if [ -z "$START_DATE" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              START_DATE="$(date -u -d '7 days ago' +%F)"
            else
              START_DATE="$(date -u -d '89 days ago' +%F)"
            fi
          fi

          echo "start_date=$START_DATE" >> "$GITHUB_OUTPUT"
          echo "end_date=$END_DATE" >> "$GITHUB_OUTPUT"
          echo "split_date=$SPLIT_DATE" >> "$GITHUB_OUTPUT"
          echo "chunk_days=$CHUNK_DAYS" >> "$GITHUB_OUTPUT"

      - name: Compile collectors
        run: |
          python -m py_compile app/stage166f_github_gdelt_backfill.py
          python -m py_compile app/stage166g_gdelt_persistent_store.py

      - name: Fetch bounded hot window sequentially
        run: |
          rm -rf "$INCOMING_DIR" "$PERSIST_DIR"
          mkdir -p "$INCOMING_DIR" "$PERSIST_DIR"
          python app/stage166f_github_gdelt_backfill.py fetch \
            --output-dir "$INCOMING_DIR" \
            --start-date "${{ steps.vars.outputs.start_date }}" \
            --end-date "${{ steps.vars.outputs.end_date }}" \
            --split-date "${{ steps.vars.outputs.split_date }}" \
            --chunk-days "${{ steps.vars.outputs.chunk_days }}" \
            --max-workers 1 \
            --max-queries 0 \
            --timeout-seconds 35 \
            --max-retries 4 \
            --retry-backoff-seconds 10 \
            --request-delay-seconds 12

      - name: Recover prior persistent snapshot
        shell: bash
        run: |
          PRIOR_DIR="$(mktemp -d)"
          echo "$PRIOR_DIR" > /tmp/stage166g_prior_dir
          if git fetch --quiet --depth=1 origin "$PUBLISH_BRANCH"; then
            for name in \
              stage166g_persistent_gdelt_points.csv \
              stage166g_fetch_ledger.csv \
              stage166g_persistent_manifest.json \
              stage166f_gdelt_points.csv; do
              tmp="$PRIOR_DIR/$name.tmp"
              if git show "FETCH_HEAD:$name" > "$tmp" 2>/dev/null && [ -s "$tmp" ]; then
                if [ "$name" = "stage166g_persistent_manifest.json" ]; then
                  if python -m json.tool "$tmp" >/dev/null 2>&1; then
                    mv "$tmp" "$PRIOR_DIR/$name"
                  else
                    echo "Ignoring invalid prior manifest from $PUBLISH_BRANCH"
                    rm -f "$tmp"
                  fi
                else
                  mv "$tmp" "$PRIOR_DIR/$name"
                fi
              else
                rm -f "$tmp"
              fi
            done
          fi

      - name: Merge status-aware persistent store
        shell: bash
        run: |
          PRIOR_DIR="$(cat /tmp/stage166g_prior_dir)"
          python app/stage166g_gdelt_persistent_store.py \
            --prior-dir "$PRIOR_DIR" \
            --incoming-dir "$INCOMING_DIR" \
            --out-dir "$PERSIST_DIR" \
            --freeze-lag-hours 72

      - name: Upload immutable run artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage166g-gdelt-persistent-${{ github.run_id }}
          path: reports/stage166g_gdelt_persistent_store
          retention-days: 30
          if-no-files-found: error

      - name: Publish persistent snapshot branch
        shell: bash
        run: |
          PUBLISH_DIR="$(mktemp -d)"
          cp -R "$PERSIST_DIR"/. "$PUBLISH_DIR"/
          date -u +%Y-%m-%dT%H:%M:%SZ > "$PUBLISH_DIR/generated_utc.txt"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan stage166g-publish-tmp
          git rm -rf .
          git clean -fdx
          cp -R "$PUBLISH_DIR"/. .
          git add -A
          git commit -m "Publish persistent Stage166G GDELT snapshot"
          git push --force origin "HEAD:refs/heads/$PUBLISH_BRANCH"
