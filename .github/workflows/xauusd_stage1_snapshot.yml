name: XAUUSD Stage 1 Data Snapshot

on:
  workflow_dispatch:
    inputs:
      intervals:
        description: "Comma-separated intervals"
        required: true
        default: "1min,5min,15min,1h"
      outputsize:
        description: "Candles per interval"
        required: true
        default: "500"

jobs:
  stage1-snapshot:
    runs-on: ubuntu-latest

    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Stage 1 multi-interval snapshot
        run: |
          python -m app.xauusd_stage1_snapshot --intervals "${{ github.event.inputs.intervals }}" --outputsize "${{ github.event.inputs.outputsize }}"

      - name: Upload Stage 1 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-stage1-snapshot-${{ github.run_number }}
          path: |
            data/raw/*.json
            data/normalized/*.csv
            data/reports/*.json
            data/reports/*.md
          if-no-files-found: error
