name: XAUUSD Stage 2D Baseline Grid Lab

on:
  workflow_dispatch:
    inputs:
      intervals:
        description: "Comma-separated intervals collected before grid lab"
        required: true
        default: "1min,5min,15min,1h"
      outputsize:
        description: "Candles per interval. Use 5000 if your Twelve Data plan allows it."
        required: true
        default: "5000"
      force_refresh:
        description: "Fetch fresh Twelve Data candles instead of reusing restored cache"
        required: true
        default: "false"
      include_run_link:
        description: "Include GitHub run link in Telegram success messages"
        required: true
        default: "false"

jobs:
  stage2d-grid-lab:
    runs-on: ubuntu-latest

    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_INCLUDE_RUN_LINK: ${{ github.event.inputs.include_run_link }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore XAUUSD data cache
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/normalized
          key: xauusd-data-${{ github.workflow }}-${{ github.event.inputs.outputsize }}-${{ github.run_id }}
          restore-keys: |
            xauusd-data-${{ github.workflow }}-${{ github.event.inputs.outputsize }}-
            xauusd-data-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Stage 1 cache-aware snapshot
        run: |
          if [ "${{ github.event.inputs.force_refresh }}" = "true" ]; then
            python -m app.xauusd_stage1_snapshot --intervals "${{ github.event.inputs.intervals }}" --outputsize "${{ github.event.inputs.outputsize }}" --force-refresh
          else
            python -m app.xauusd_stage1_snapshot --intervals "${{ github.event.inputs.intervals }}" --outputsize "${{ github.event.inputs.outputsize }}"
          fi

      - name: Run Stage 2D baseline grid lab
        run: |
          python -m app.xauusd_stage2d_grid_lab

      - name: Send Telegram notification
        if: always()
        env:
          WORKFLOW_STATUS: ${{ job.status }}
        run: |
          python -m app.telegram_notify --status "${WORKFLOW_STATUS}"

      - name: Upload Stage 2D slim artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-stage2d-grid-lab-slim-${{ github.run_number }}
          path: |
            data/reports/quality_*.json
            data/reports/stage1_snapshot_summary_*.json
            data/reports/stage1_snapshot_summary_*.md
            data/reports/stage2d_grid_summary_*.json
            data/reports/stage2d_grid_summary_*.md
            data/reports/stage2d_grid_evaluations_*.csv
          if-no-files-found: warn
