name: XAUUSD Stage 2L Backfill Validation

on:
  workflow_dispatch:
    inputs:
      intervals:
        description: "Backfill intervals. Stage 2 candidates currently need 15min and 1h."
        required: true
        default: "15min,1h"
      requests_per_interval:
        description: "Backfill requests per interval. Start with 1 to conserve API credits."
        required: true
        default: "1"
      include_run_link:
        description: "Include GitHub run link in Telegram success messages"
        required: true
        default: "false"

permissions:
  contents: write

concurrency:
  group: xauusd-stage2l-backfill-validation
  cancel-in-progress: false

jobs:
  stage2l-backfill-validation:
    runs-on: ubuntu-latest

    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_INCLUDE_RUN_LINK: ${{ github.event.inputs.include_run_link }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify SQLite store exists
        run: |
          test -f data/store/xauusd.sqlite
          test -f data/store/manifest.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Backfill older SQLite history
        run: |
          python -m app.xauusd_store_backfill             --intervals "${{ github.event.inputs.intervals }}"             --requests-per-interval "${{ github.event.inputs.requests_per_interval }}"

      - name: Commit backfilled SQLite store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f data/store/xauusd.sqlite data/store/manifest.json data/store/backfill_manifest.json

          if git diff --cached --quiet; then
            echo "No backfill data changes to commit."
          else
            git commit -m "Backfill XAUUSD SQLite data store"
            git pull --rebase
            git push
          fi

      - name: Run Stage 2D fast grid lab
        run: |
          python -m app.xauusd_stage2d_grid_lab --data-db data/store/xauusd.sqlite

      - name: Run Stage 2J candidate stability analysis
        run: |
          python -m app.xauusd_stage2j_candidate_analysis --data-db data/store/xauusd.sqlite

      - name: Run Stage 2K walk-forward validation
        run: |
          python -m app.xauusd_stage2k_walkforward --data-db data/store/xauusd.sqlite

      - name: Send Telegram notification
        if: always()
        env:
          WORKFLOW_STATUS: ${{ job.status }}
        run: |
          python -m app.telegram_notify --status "${WORKFLOW_STATUS}"

      - name: Upload Stage 2L artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-stage2l-backfill-validation-${{ github.run_number }}
          path: |
            data/store/manifest.json
            data/store/backfill_manifest.json
            data/reports/stage2d_grid_summary_*.json
            data/reports/stage2d_grid_summary_*.md
            data/reports/stage2d_grid_evaluations_*.csv
            data/reports/stage2j_candidate_stability_summary_*.json
            data/reports/stage2j_candidate_stability_summary_*.md
            data/reports/stage2k_walkforward_summary_*.json
            data/reports/stage2k_walkforward_summary_*.md
          if-no-files-found: warn
