name: XAUUSD Stage 3C Overlap Feed Diagnostics

on:
  workflow_dispatch:
    inputs:
      include_run_link:
        description: "Include GitHub run link in Telegram success messages"
        required: true
        default: "false"

permissions:
  contents: read

concurrency:
  group: xauusd-stage3c-overlap-diagnostics
  cancel-in-progress: true

jobs:
  stage3c-overlap-diagnostics:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_INCLUDE_RUN_LINK: ${{ github.event.inputs.include_run_link }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify SQLite stores exist
        run: |
          test -f data/store/xauusd.sqlite
          test -f data/second_source/second_source.sqlite

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run Stage 3C overlap diagnostics
        run: |
          python -m app.xauusd_stage3c_overlap_diagnostics

      - name: Send Telegram notification
        if: always()
        env:
          WORKFLOW_STATUS: ${{ job.status }}
        run: |
          python -m app.telegram_notify --status "${WORKFLOW_STATUS}"

      - name: Upload Stage 3C artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-stage3c-overlap-diagnostics-${{ github.run_number }}
          path: |
            data/reports/stage3c_overlap_diagnostics_summary_*.json
            data/reports/stage3c_overlap_diagnostics_summary_*.md
          if-no-files-found: warn
