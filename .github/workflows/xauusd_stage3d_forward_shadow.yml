name: XAUUSD Stage 3D Forward Shadow

on:
  workflow_dispatch:
    inputs:
      include_run_link:
        description: "Include GitHub run link in Telegram success messages"
        required: true
        default: "false"
  workflow_run:
    workflows: ["XAUUSD Persistent Data Store Refresh"]
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: xauusd-stage3d-forward-shadow
  cancel-in-progress: false

jobs:
  stage3d-forward-shadow:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_INCLUDE_RUN_LINK: ${{ github.event.inputs.include_run_link || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify primary SQLite store exists
        run: |
          test -f data/store/xauusd.sqlite

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run Stage 3D forward shadow
        run: |
          python -m app.xauusd_forward_shadow

      - name: Commit forward shadow database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f data/shadow/forward_shadow.sqlite

          if git diff --cached --quiet; then
            echo "No forward shadow DB changes to commit."
          else
            git commit -m "Update XAUUSD forward shadow log"
            git pull --rebase
            git push
          fi

      - name: Send Telegram notification
        if: always()
        env:
          WORKFLOW_STATUS: ${{ job.status }}
        run: |
          python -m app.telegram_notify --status "${WORKFLOW_STATUS}"

      - name: Upload Stage 3D artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-stage3d-forward-shadow-${{ github.run_number }}
          path: |
            data/reports/stage3d_forward_shadow_summary_*.json
            data/reports/stage3d_forward_shadow_summary_*.md
          if-no-files-found: warn
