name: XAUUSD Stage 4A Execution Replay

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xauusd-stage4a-execution-replay
  cancel-in-progress: true

jobs:
  stage4a-execution-replay:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify MT5 second-source SQLite exists
        run: |
          test -f data/second_source/second_source.sqlite

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run Stage 4A execution replay
        run: |
          python -m app.xauusd_stage4a_execution_replay

      - name: Upload Stage 4A artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-stage4a-execution-replay-${{ github.run_number }}
          path: |
            data/reports/stage4a_execution_replay_summary_*.json
            data/reports/stage4a_execution_replay_summary_*.md
            data/reports/stage4a_execution_replay_trades_*.csv
          if-no-files-found: warn
