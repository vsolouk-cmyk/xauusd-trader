name: XAUUSD Collectors

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * 1-5"
    - cron: "15 21 * * 1-5"
    - cron: "25 6 * * *"

jobs:
  event-pipeline:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */3 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run legacy GDELT/news event pipeline if available
        run: |
          if [ -f app/stage10b_event_pipeline_update.py ]; then
            python -m app.stage10b_event_pipeline_update \
              --gdelt-timespan 7d \
              --gdelt-max-records 10 \
              --gdelt-query-mode rate_safe \
              --gdelt-timeout 60 \
              --gdelt-retries 2 \
              --gdelt-query-delay 20
          else
            echo "Stage10B legacy event pipeline is archived/missing; skipping this optional collector."
            mkdir -p data/reports/stage10b_event_pipeline_update data/macro/events
            cat > data/reports/stage10b_event_pipeline_update/stage10b_event_pipeline_update.md <<'EOF'
          # Stage10B Legacy Event Pipeline

          Decision: `STAGE10B_LEGACY_COLLECTOR_SKIPPED_ARCHIVED_OR_MISSING`

          Stage10B is treated as a legacy optional collector in this workflow. The file `app/stage10b_event_pipeline_update.py` was not present in this checkout, so the GitHub Actions collector skipped it instead of failing the full workflow.
          EOF
          fi

      - name: Write workflow metadata
        run: |
          mkdir -p data/reports/workflow_metadata
          cat > data/reports/workflow_metadata/xauusd_collectors_event_pipeline_run_metadata.json <<EOF
          {
            "workflow": "${GITHUB_WORKFLOW}",
            "job": "${GITHUB_JOB}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "repository": "${GITHUB_REPOSITORY}",
            "ref": "${GITHUB_REF}",
            "sha": "${GITHUB_SHA}",
            "event_name": "${GITHUB_EVENT_NAME}",
            "runner_os": "${RUNNER_OS}",
            "collector": "event_pipeline"
          }
          EOF

      - name: Upload event pipeline artifact
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-event-pipeline-run-${{ github.run_number }}
          path: |
            data/config/stage10a_news_events.csv
            data/macro/events/
            data/reports/stage10b_event_pipeline_update/
            data/reports/workflow_metadata/xauusd_collectors_event_pipeline_run_metadata.json
          if-no-files-found: ignore
          retention-days: 14

  macro-numeric:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 21 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run legacy macro numeric update if available
        run: |
          if [ -f app/stage9b_macro_numeric_update.py ]; then
            python -m app.stage9b_macro_numeric_update
          else
            echo "Stage9B macro numeric updater is archived/missing; skipping this optional collector."
            mkdir -p data/reports/stage9b_macro_numeric_update data/macro
            cat > data/reports/stage9b_macro_numeric_update/stage9b_macro_numeric_update.md <<'EOF'
          # Stage9B Macro Numeric Update

          Decision: `STAGE9B_MACRO_NUMERIC_SKIPPED_ARCHIVED_OR_MISSING`

          Stage9B macro numeric update is treated as a legacy optional collector in this workflow. The file `app/stage9b_macro_numeric_update.py` was not present in this checkout, so the GitHub Actions collector skipped it instead of failing the full workflow.
          EOF
          fi

      - name: Write workflow metadata
        run: |
          mkdir -p data/reports/workflow_metadata
          cat > data/reports/workflow_metadata/xauusd_collectors_macro_numeric_run_metadata.json <<EOF
          {
            "workflow": "${GITHUB_WORKFLOW}",
            "job": "${GITHUB_JOB}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "repository": "${GITHUB_REPOSITORY}",
            "ref": "${GITHUB_REF}",
            "sha": "${GITHUB_SHA}",
            "event_name": "${GITHUB_EVENT_NAME}",
            "runner_os": "${RUNNER_OS}",
            "collector": "macro_numeric"
          }
          EOF

      - name: Upload macro numeric artifact
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-macro-numeric-run-${{ github.run_number }}
          path: |
            data/macro/
            data/reports/stage9b_macro_numeric_update/
            data/reports/workflow_metadata/xauusd_collectors_macro_numeric_run_metadata.json
          if-no-files-found: ignore
          retention-days: 14

  macro-calendar:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '25 6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run legacy macro event calendar update if available
        run: |
          if [ -f app/stage9b_macro_event_calendar_update.py ]; then
            python -m app.stage9b_macro_event_calendar_update
          else
            echo "Stage9B macro event calendar updater is archived/missing; skipping this optional collector."
            mkdir -p data/reports/stage9b_macro_event_calendar_update data/config
            cat > data/reports/stage9b_macro_event_calendar_update/stage9b_macro_event_calendar_update.md <<'EOF'
          # Stage9B Macro Event Calendar Update

          Decision: `STAGE9B_MACRO_CALENDAR_SKIPPED_ARCHIVED_OR_MISSING`

          Stage9B macro event calendar update is treated as a legacy optional collector in this workflow. The file `app/stage9b_macro_event_calendar_update.py` was not present in this checkout, so the GitHub Actions collector skipped it instead of failing the full workflow.
          EOF
          fi

      - name: Write workflow metadata
        run: |
          mkdir -p data/reports/workflow_metadata
          cat > data/reports/workflow_metadata/xauusd_collectors_macro_calendar_run_metadata.json <<EOF
          {
            "workflow": "${GITHUB_WORKFLOW}",
            "job": "${GITHUB_JOB}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "repository": "${GITHUB_REPOSITORY}",
            "ref": "${GITHUB_REF}",
            "sha": "${GITHUB_SHA}",
            "event_name": "${GITHUB_EVENT_NAME}",
            "runner_os": "${RUNNER_OS}",
            "collector": "macro_calendar"
          }
          EOF

      - name: Upload macro calendar artifact
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-macro-calendar-run-${{ github.run_number }}
          path: |
            data/config/stage10a_news_events.csv
            data/reports/stage9b_macro_event_calendar_update/
            data/reports/workflow_metadata/xauusd_collectors_macro_calendar_run_metadata.json
          if-no-files-found: ignore
          retention-days: 14
