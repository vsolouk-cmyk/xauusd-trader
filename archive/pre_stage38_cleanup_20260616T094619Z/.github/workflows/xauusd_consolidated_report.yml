name: XAUUSD Consolidated Report

on:
  workflow_dispatch:
  schedule:
    - cron: "45 21 * * 1-5"

jobs:
  consolidated-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run Stage 12A consolidated report
        run: |
          python -m app.stage12a_consolidated_forward_shadow_report

      - name: Write workflow metadata
        run: |
          mkdir -p data/reports/stage12a_consolidated_forward_shadow_report
          cat > data/reports/stage12a_consolidated_forward_shadow_report/workflow_run_metadata.json <<EOF
          {
            "workflow": "${GITHUB_WORKFLOW}",
            "job": "${GITHUB_JOB}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "repository": "${GITHUB_REPOSITORY}",
            "ref": "${GITHUB_REF}",
            "sha": "${GITHUB_SHA}",
            "event_name": "${GITHUB_EVENT_NAME}",
            "runner_os": "${RUNNER_OS}",
            "collector": "stage12a_consolidated_report"
          }
          EOF

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-consolidated-report-run-${{ github.run_number }}
          path: |
            data/reports/stage12a_consolidated_forward_shadow_report/
          retention-days: 14
