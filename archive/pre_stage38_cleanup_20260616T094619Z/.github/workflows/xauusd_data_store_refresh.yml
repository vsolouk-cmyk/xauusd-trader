name: XAUUSD Persistent Data Store Refresh

on:
  workflow_dispatch:
    inputs:
      intervals:
        description: "Comma-separated intervals to refresh"
        required: true
        default: "1min,5min,15min,1h"
      force_refresh:
        description: "Force provider refresh even if store is fresh"
        required: true
        default: "false"
  schedule:
    - cron: "17 * * * 1-5"

permissions:
  contents: write

concurrency:
  group: xauusd-data-store-refresh
  cancel-in-progress: false

jobs:
  refresh-store:
    runs-on: ubuntu-latest

    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Refresh SQLite data store
        run: |
          if [ "${{ github.event.inputs.force_refresh }}" = "true" ]; then
            python -m app.xauusd_store_refresh --intervals "${{ github.event.inputs.intervals || '1min,5min,15min,1h' }}" --force-refresh
          else
            python -m app.xauusd_store_refresh --intervals "${{ github.event.inputs.intervals || '1min,5min,15min,1h' }}"
          fi

      - name: Commit SQLite store update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f data/store/xauusd.sqlite data/store/manifest.json

          if git diff --cached --quiet; then
            echo "No data store changes to commit."
          else
            git commit -m "Update XAUUSD SQLite data store"
            git pull --rebase
            git push
          fi

      - name: Upload store manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-data-store-manifest-${{ github.run_number }}
          path: |
            data/store/manifest.json
          if-no-files-found: warn
