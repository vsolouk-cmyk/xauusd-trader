name: XAUUSD FRED Exogenous Refresh

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "First date to keep in FRED exogenous CSVs, YYYY-MM-DD"
        required: false
        default: "2022-05-01"
      series:
        description: "FRED series to refresh: all, dxy, us10y, real_yield, vix, spx, oil, or comma list"
        required: false
        default: "all"
      endpoint_mode:
        description: "FRED endpoint: api, graph, or auto. api is fastest but requires FRED_API_KEY secret."
        required: false
        default: "api"
      graph_fallback:
        description: "If API fails, fallback to legacy fredgraph endpoint: 0 or 1"
        required: false
        default: "0"
      strict:
        description: "Fail workflow if any selected FRED source fails: 0 or 1"
        required: false
        default: "0"
      attempts:
        description: "Attempts per selected FRED source"
        required: false
        default: "3"
      request_delay:
        description: "Seconds to wait between selected series"
        required: false
        default: "2"
      run_stage31a:
        description: "Run Stage31A in GitHub after download: 0 or 1. Local run is preferred."
        required: false
        default: "0"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  fred-exogenous-refresh:
    name: Download selected FRED exogenous data
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install pandas numpy
          fi
          python -m pip install tabulate


      - name: Validate FRED API key for API mode
        if: ${{ github.event.inputs.endpoint_mode == 'api' || github.event.inputs.endpoint_mode == '' }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -z "${FRED_API_KEY}" ]; then
            echo "FRED_API_KEY repository secret is required when endpoint_mode=api."
            echo "Add it under GitHub → Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

      - name: Download selected FRED exogenous CSVs
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FRED_EXOGENOUS_START_DATE: ${{ github.event.inputs.start_date || '2022-05-01' }}
          FRED_EXOGENOUS_SERIES: ${{ github.event.inputs.series || 'all' }}
          FRED_EXOGENOUS_ENDPOINT_MODE: ${{ github.event.inputs.endpoint_mode || 'api' }}
          FRED_EXOGENOUS_GRAPH_FALLBACK: ${{ github.event.inputs.graph_fallback || '0' }}
          FRED_EXOGENOUS_OUT_DIR: data/exogenous
          FRED_EXOGENOUS_STRICT: ${{ github.event.inputs.strict || '0' }}
          FRED_EXOGENOUS_ATTEMPTS: ${{ github.event.inputs.attempts || '3' }}
          FRED_EXOGENOUS_REQUEST_DELAY: ${{ github.event.inputs.request_delay || '2' }}
        run: |
          python tools/download_fred_exogenous.py
          echo "Selected-success artifact files:"
          find data/exogenous/_artifact_success -maxdepth 1 -type f -print -exec wc -l {} \; || true
          echo "FRED manifest:"
          cat data/exogenous/fred_download_manifest.csv || true

      - name: Build Stage30A ML dataset if Stage31A requested
        if: ${{ github.event.inputs.run_stage31a == '1' }}
        run: |
          if [ -f app/stage30a_candidate_pool_builder_ml_dataset.py ]; then
            python -m app.stage30a_candidate_pool_builder_ml_dataset
          else
            echo "Stage30A module is missing; Stage31A will emit a base-dataset readiness report."
          fi
          ls -lh data/reports/stage30a_candidate_pool_builder_ml_dataset/stage30a_ml_meta_dataset.csv || true

      - name: Run Stage31A exogenous ingestion if requested
        if: ${{ github.event.inputs.run_stage31a == '1' }}
        run: |
          python -m app.stage31a_exogenous_feature_ingestion
          cat data/reports/stage31a_exogenous_feature_ingestion/stage31a_exogenous_feature_ingestion.md

      - name: Upload selected FRED exogenous artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-fred-exogenous-${{ github.event.inputs.series || 'all' }}-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            data/exogenous/_artifact_success/*.csv
            data/exogenous/_artifact_success/*.txt
            data/exogenous/fred_download_manifest.csv
            data/reports/stage31a_exogenous_feature_ingestion/
            data/reports/stage30a_candidate_pool_builder_ml_dataset/
