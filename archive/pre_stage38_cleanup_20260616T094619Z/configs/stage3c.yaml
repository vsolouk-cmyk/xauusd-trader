# Stage 3C overlap-aligned second-source diagnostics.
# Goal: determine whether Stage 3A failed because of true feed degradation
# or because primary/secondary were compared over different date ranges.

candidate:
  family: sma_trend_1h
  variant: sma10_h12_dist10_cool1
  interval: 1h
  sma_window: 10
  horizon_bars: 12
  min_distance_usd: 10.0
  cooldown_bars: 1

cost_model:
  assumed_spread_usd: 0.30
  assumed_slippage_usd: 0.05
  total_roundtrip_cost_usd: 0.35

sources:
  primary:
    name: twelvedata_primary
    db_path: data/store/xauusd.sqlite

  secondary:
    name: mt5_second_source
    db_path: data/second_source/second_source.sqlite

diagnostics:
  # MT5 broker-server candles may not align perfectly with UTC vendor candles.
  # We evaluate exact import and small timestamp shifts as diagnostics only.
  secondary_time_shift_hours:
    - -3
    - -2
    - -1
    - 0
    - 1
    - 2
    - 3

decision:
  min_overlap_days: 365
  min_secondary_trades: 100
  min_secondary_profit_factor: 1.05
  require_secondary_total_positive: true
  require_secondary_cost_x4_positive: true
  max_total_net_degradation_ratio: 0.65

report_dir: data/reports
