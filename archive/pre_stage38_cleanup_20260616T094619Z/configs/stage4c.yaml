# Stage 4C selected scenario validation.
# Goal: lock the best Stage 4B candidate and stress-test it before any demo/paper/live step.
#
# This is NOT ML.
# This is NOT paper-order.
# This is NOT live trading.

selected_scenario:
  name: long_tp24_sl15
  side_filter: long
  take_profit_usd: 24.0
  stop_loss_usd: 15.0

baseline_reference:
  name: long_time_exit
  side_filter: long
  take_profit_usd: null
  stop_loss_usd: null

thresholds:
  min_trades: 100
  min_profit_factor: 1.25
  min_median_net_usd: 0.0
  min_positive_fold_ratio: 0.8
  max_ambiguous_exit_ratio: 0.05
  max_drawdown_improvement_required: true

stress_tests:
  cost_multipliers: [1, 2, 3, 4]
  min_cost_x2_total_net_usd: 0.0
  min_cost_x3_total_net_usd: 0.0

report_dir: data/reports
