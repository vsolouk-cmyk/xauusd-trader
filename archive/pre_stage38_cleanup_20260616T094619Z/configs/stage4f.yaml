# Stage 4F demo-readiness pack.
# Goal: convert Stage 4E results into a locked candidate decision package.
#
# This is NOT ML.
# This is NOT paper-order.
# This is NOT live trading.

selected_session_set: no_london

minimum_gates:
  min_trades: 250
  min_profit_factor: 1.45
  min_median_net_usd: 1.0
  max_drawdown_usd_abs: 100.0
  min_positive_fold_ratio: 1.0
  min_positive_year_ratio: 0.75

baseline_comparison_required:
  total_net_better_than_baseline_all: true
  pf_better_than_baseline_all: true
  median_better_than_baseline_all: true
  drawdown_better_than_baseline_all: true

report_dir: data/reports
locked_strategy_path: configs/locked_strategy_v1.yaml
