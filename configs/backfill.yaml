# Stage 2L historical backfill configuration.
# Goal: deepen SQLite history before trusting Stage 2D/2J/2K candidates.
#
# This is intentionally manual, not scheduled, because backfill consumes API credits.

provider: twelvedata
symbol: XAU/USD
timezone: UTC

db_path: data/store/xauusd.sqlite

# Detailed per-backfill report.
manifest_path: data/store/backfill_manifest.json

# Primary store manifest. Keep this synchronized after backfill too.
store_manifest_path: data/store/manifest.json

# Current validated candidate family uses 1h.
# 15min remains available, but do not backfill it unless a 15min candidate becomes relevant.
intervals:
  - 1h

# Store intervals to summarize in primary manifest.
store_intervals:
  - 1min
  - 5min
  - 15min
  - 1h

backfill:
  requests_per_interval: 1
  sleep_seconds_between_requests: 8
  outputsize: 5000

  chunk_days:
    15min: 45
    1h: 180
    5min: 14
    1min: 3

  max_rows_per_interval: 60000
