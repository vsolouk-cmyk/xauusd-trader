# Stage 0/1 data-source configuration.
# Current primary provider: Twelve Data REST.
#
# Required secret/environment variable:
#   TWELVEDATA_API_KEY
#
# This file is safe to commit because it contains no secrets.

provider: twelvedata

symbol: XAU/USD

intervals:
  - 1min
  - 5min
  - 15min
  - 1h

outputsize: 5000
timezone: UTC

raw_dir: data/raw
normalized_dir: data/normalized
report_dir: data/reports

# Cache policy:
# - Local runs reuse latest normalized CSV if it has enough rows and is not too old.
# - GitHub Actions restores data/raw and data/normalized via actions/cache, then this script decides whether to reuse.
# - Use --force-refresh when you explicitly need fresh provider data.
cache:
  enabled: true
  max_age_minutes: 720
  min_rows_policy: requested_outputsize

cost_model:
  spread_available: false
  assumed_spread_usd: 0.30
  assumed_slippage_usd: 0.05

quality:
  max_missing_ratio: 0.02
  max_duplicate_timestamps: 0
