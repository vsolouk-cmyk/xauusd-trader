# Persistent SQLite data store for XAUUSD.
# SQLite = small local SQL database stored as one file.
# Each timeframe is stored in a separate table.

provider: twelvedata
symbol: XAU/USD
timezone: UTC

intervals:
  - 1min
  - 5min
  - 15min
  - 1h

db_path: data/store/xauusd.sqlite
manifest_path: data/store/manifest.json

refresh:
  stale_after_minutes: 90
  initial_outputsize: 5000
  min_incremental_outputsize: 50
  max_incremental_outputsize: 500
  overlap_bars: 20

  # Raised from 20000 because Stage 2L backfill reached the previous cap.
  # If this remains too low, routine refresh can trim historical backfill.
  max_rows_per_interval: 60000
