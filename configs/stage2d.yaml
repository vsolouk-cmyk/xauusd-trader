# Stage 2D baseline grid lab.
# SQLite store is now the primary data source.

data_db: data/store/xauusd.sqlite
data_dir: data/normalized
report_dir: data/reports
trades_dir: data/reports/stage2d_trades

cost_model:
  assumed_spread_usd: 0.30
  assumed_slippage_usd: 0.05
  total_roundtrip_cost_usd: 0.35

split:
  train_fraction: 0.60

decision:
  min_trades: 50
  min_test_trades: 20
  require_train_positive: true
  require_test_positive: true
  require_remove_top_5_positive: true
  require_cost_x2_positive: true
  require_profit_factor_min: 1.05

families:
  sma_trend_1h:
    enabled: true
    interval: 1h
    sma_windows: [10, 20, 50, 100]
    horizon_bars: [1, 2, 3, 6, 12]
    cooldown_bars: [0, 1]
    min_distance_usd: [0.0, 5.0, 10.0]

  session_momentum_15min:
    enabled: true
    interval: 15min
    lookback_bars: [1, 2, 4]
    horizon_bars: [1, 2, 4, 8]
    cooldown_bars: [0, 1]
    min_move_usd: [0.0, 2.0, 5.0]
    sessions: [london, london_ny_overlap, new_york]

  range_expansion_15min:
    enabled: true
    interval: 15min
    avg_range_windows: [10, 20, 50]
    range_multipliers: [1.2, 1.5, 2.0]
    horizon_bars: [1, 2, 4, 8]
    cooldown_bars: [0, 1]
