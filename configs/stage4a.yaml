# Stage 4A MT5 M1/H1 execution-realistic replay.
# Goal: replay the fixed H1 candidate using M1 path data for MAE/MFE and execution diagnostics.
#
# This is NOT ML.
# This is NOT paper-order.
# This is NOT live trading.

candidate:
  family: sma_trend_1h
  variant: sma10_h12_dist10_cool1
  signal_interval: 1h
  path_interval: 1min
  sma_window: 10
  horizon_bars: 12
  min_distance_usd: 10.0
  cooldown_bars: 1

data:
  # MT5 H1 and M1 should both be imported into this same SQLite DB.
  # Import H1 with --interval 1h and M1 with --interval 1min.
  mt5_db_path: data/second_source/second_source.sqlite

execution:
  # Signal is detected on closed H1 candle.
  # Entry is the first M1 open at or after the next H1 candle time.
  entry_model: next_h1_open_via_m1

  # Current baseline exits after 12 H1 candles.
  exit_model: time_exit_via_m1_close

  # No final TP/SL yet. Stage 4A measures MAE/MFE to design them later.
  use_tp_sl: false

cost_model:
  assumed_spread_usd: 0.30
  assumed_slippage_usd: 0.05
  total_roundtrip_cost_usd: 0.35

diagnostics:
  save_trades_csv: true
  mae_mfe_quantiles: [0.1, 0.25, 0.5, 0.75, 0.9]
  min_trades: 100

report_dir: data/reports
